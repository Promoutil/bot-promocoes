name: Rodar Bot Promoções

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Rodar bot
        run: python bot.py

      - name: Upload promocoes
        uses: actions/upload-artifact@v4
        with:
          name: promocoes
          path: promocoes.txt
